<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVIC — ნიუ ვიჟენის ინოვაციების კონკურსი | New Vision Innovation Challenge</title>
<meta name="description" content="New Vision Innovation Challenge (NVIC) — national innovation & research competition for school students grades VII–XII, organized by New Vision University, Georgia. Registration opens Nov 30, 2026.">
<link rel="icon" type="image/svg+xml" href="nvu-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f5f0;--card:#ffffff;--ink:#1d2733;--mut:#5b6472;--dim:#8a93a1;--line:#e5e1d8;--cy:#0e7490;--cyd:#155e75;--vio:#6d28d9;--amb:#b45309;--ok:#15803d}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans Georgian",system-ui,sans-serif;line-height:1.6}
h1,h2,h3,.disp{font-family:Fraunces,"Noto Serif Georgian",Georgia,serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:30;background:rgba(247,245,240,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:16px;padding:12px 20px;max-width:1080px;margin:0 auto}
.hbar img{height:34px;width:auto}
.wm b{font-family:Fraunces,"Noto Serif Georgian",serif;font-size:17px;letter-spacing:.02em;display:block;line-height:1.15}
.wm span{font-size:10.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
nav{margin-left:auto;display:flex;gap:4px;align-items:center}
nav a{color:var(--mut);text-decoration:none;font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px}
nav a:hover{color:var(--ink);background:#ece8df}
.langb{margin-left:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--cyd)}
.langb:hover{border-color:var(--cy)}
.hero{padding:72px 0 56px;text-align:center;position:relative;overflow:hidden}
.hero .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cyd);border:1px solid #cde3ec;background:#e8f3f8;border-radius:999px;padding:7px 16px;margin-bottom:22px}
.hero h1{font-size:clamp(34px,6.4vw,64px);line-height:1.08;font-weight:700;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--cyd)}
.hero .sub{max-width:640px;margin:18px auto 0;color:var(--mut);font-size:17px}
.cd{display:flex;gap:10px;justify-content:center;margin:34px 0 8px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;width:86px;box-shadow:0 1px 2px rgba(29,39,51,.05)}
.cd b{font-family:Fraunces,"Noto Serif Georgian",serif;font-size:30px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.reg{color:var(--mut);font-size:14px;margin-top:10px}
.reg b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:44px auto 0;max-width:820px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center}
.stat b{font-family:Fraunces,"Noto Serif Georgian",serif;font-size:24px;color:var(--cyd);display:block}
.stat span{font-size:12px;color:var(--dim)}
section{padding:56px 0 8px}
h2{font-size:clamp(24px,3.4vw,34px);font-weight:700;letter-spacing:-.01em;margin-bottom:22px;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:34px;height:3px;background:linear-gradient(90deg,var(--cy),var(--vio));border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(29,39,51,.04)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cat{position:relative;overflow:hidden}
.cat .num{position:absolute;top:-14px;right:6px;font-family:Fraunces,serif;font-size:110px;font-weight:700;color:rgba(14,116,144,.06);line-height:1}
.cat h3{font-size:19px;margin:0 0 8px;padding:0 44px 0 0}
.cat p{color:var(--mut);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;color:var(--mut);background:#f2efe8;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.fl{position:relative;padding-left:34px}
.fl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--cy),var(--vio),var(--ok))}
.fl .it{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(29,39,51,.04)}
.fl .it::before{content:attr(data-n);position:absolute;left:-34px;top:20px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:var(--paper);border:2px solid var(--cy);color:var(--cyd);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif}
.fl .it h3{font-size:17px;margin-bottom:6px}
.fl .it p{color:var(--mut);font-size:14px}
ul.check{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}
ul.check li{position:relative;padding-left:26px;color:var(--mut);font-size:14.5px}
ul.check li::before{content:"✓";position:absolute;left:0;top:0;color:var(--ok);font-weight:800}
.crit{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit .n{flex:0 0 30px;height:30px;border-radius:50%;background:#e8f3f8;border:1px solid #cde3ec;color:var(--cyd);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:Fraunces,serif}
.crit b{display:block;font-size:15px}
.crit span{color:var(--mut);font-size:13.5px}
.aw{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.aw .card b{display:block;font-family:Fraunces,"Noto Serif Georgian",serif;font-size:17px;margin-bottom:6px}
.aw .card p{color:var(--mut);font-size:13.5px}
.aw .gold{border-color:#e8d9b8;background:linear-gradient(180deg,#fdfaf3,#fff)}
.aw .gold b{color:var(--amb)}
.note{margin-top:14px;color:var(--dim);font-size:13px;background:#f2efe8;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.dates .card b{font-family:Fraunces,"Noto Serif Georgian",serif;color:var(--cyd);font-size:18px;display:block}
.dates .card span{color:var(--mut);font-size:14px}
footer{margin-top:64px;border-top:1px solid var(--line);padding:34px 0 44px;text-align:center}
footer img{height:40px;margin-bottom:10px}
footer .o{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
footer .n{font-family:Fraunces,"Noto Serif Georgian",serif;font-weight:600}
footer a{color:var(--cyd)}
@media(max-width:760px){.grid2,.grid4,.aw,.dates{grid-template-columns:1fr}ul.check{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}nav a{display:none}}
</style>
</head>
<body>
<header><div class="hbar">
<img src="nvu-logo.svg" alt="New Vision University">
<div class="wm"><b>NVIC</b><span id="wmSub">New Vision Innovation Challenge</span></div>
<nav id="nav"></nav>
<button class="langb" id="langb" onclick="toggle()">English</button>
</div></header>

<div class="hero wrap">
<span class="eyebrow" id="eyebrow"></span>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<div class="cd" id="cd"></div>
<p class="reg" id="reg"></p>
<div class="stats" id="stats"></div>
</div>

<main class="wrap">
<section id="overview"><h2 id="ovT"></h2><div class="card" id="ovP"></div></section>
<section id="vision"><div class="grid2"><div class="card" id="vmV"></div><div class="card" id="vmM"></div></div></section>
<section id="categories"><h2 id="catT"></h2><div class="grid4" id="cats"></div><div class="note" id="inter"></div></section>
<section id="rounds"><h2 id="roundsT"></h2><div class="fl" id="roundsList"></div></section>
<section id="eligibility"><h2 id="eligT"></h2><div class="card"><ul class="check" id="elig"></ul></div></section>
<section id="evaluation"><h2 id="evalT"></h2><div class="card" id="crit"></div></section>
<section id="awards"><h2 id="awardsT"></h2><div class="aw" id="awardsList"></div></section>
<section id="dates"><h2 id="datesT"></h2><div class="dates" id="datesC"></div></section>
</main>

<footer><div class="wrap">
<img src="nvu-logo.svg" alt="New Vision University">
<div class="o" id="org"></div>
<div class="n" id="foot"></div>
</div></footer>

გ ფინალისტები განვითარების სტრუქტურირებულ ეტაპზე გადადიან. რესურსების შესაძლებლობის ფარგლებში, ნიუ ვიჟენ უნივერსიტეტი და პარტნიორები უზრუნველყოფენ კვლევის მეთოდოლოგიასთან დაკავშირებულ მითითებებს, სამეცნიერო და ტექნიკურ კონსულტაციებს, პროტოტიპის შემუშავების შესახებ რჩევებს, ბიზნესისა და ბაზრის თვალსაზრისით ვალიდაციას, პრეზენტაციის მომზადებაში მხარდაჭერას, ეთიკური და მარეგულირებელი საკითხების განხილვას და უნივერსიტეტის შესაბამის რესურსებზე წვდომას. ფინალისტები საკუთარ პროექტებს თავად ავითარებენ; საბოლოო შეფასებისას მათ უნდა გაამჟღავნონ მიღებული დახმარების მოცულობა.", "After the semifinals, finalists enter a structured development period. Where resources permit, New Vision University and partners provide research methodology guidance, scientific and technical consultation, prototype development advice, business and market validation, presentation support, ethical and regulatory considerations, and access to appropriate university resources. Finalists develop their own projects; the level of assistance received must be disclosed during final evaluation."], "badge": ""}, {"t": ["რაუნდი 3 — ეროვნული ფინალური გამოფენა", "Round 3 — National Final Exhibition"], "d": ["ფინალი თბილისში, ნიუ ვიჟენ უნივერსიტეტში გაიმართება. ფინალისტები საჯარო გამოფენასა და პროექტების ოფიციალურ დაცვაზე წარადგენენ დასრულებულ ან მნიშვნელოვნად განვითარებულ პროექტებს — ფიზიკურ პროტოტიპებს, მოქმედ პროგრამულ უზრუნველყოფას, კვლევის მიგნებებს, ექსპერიმენტების შედეგებს, საგანმანათლებლო საპილოტე პროექტებს, ვალიდირებულ ბიზნესმოდელებს, კვლევაზე დაფუძნებულ სამართლებრივ ან საჯარო პოლიტიკის წინადადებებს, შემოქმედებით და მედია ინოვაციებს. დამოუკიდებელი ჟიური გამოავლენს საერთო გამარჯვებულსა და კატეგორიების გამარჯვებულებს, ხოლო ღონისძიება დაჯილდოების ცერემონიით დასრულდება.", "The final takes place at New Vision University in Tbilisi. Finalists present completed or substantially developed projects — physical prototypes, functional software, research findings, experimental results, educational pilots, validated business models, research-based legal or policy proposals, creative and media innovations — in a public exhibition and formal project defense. An independent jury selects the overall winner and category winners, and the event concludes with an awards ceremony."], "badge": "★"}], "criteria": [[["ორიგინალურობა და ინოვაციურობა", "იდეის სიახლე და შემოთავაზებული მიდგომის შემოქმედებითობა."], ["Originality and innovation", "the novelty of the idea and the creativity of the proposed approach."]], [["პრობლემის მნიშვნელობა და გავლენა", "განსახილველი პრობლემის აქტუალურობა და მნიშვნელობა."], ["Problem significance and impact", "the relevance and importance of the problem being addressed."]], [["მეთოდოლოგია და განხორციელებადობა", "შემოთავაზებული მიდგომის ხარისხი და მისი რეალისტურად განხორციელების პოტენციალი."], ["Methodology and feasibility", "the quality of the proposed approach and its realistic implementation potential."]], [["კვლევისა და განვითარების ხარისხი", "მტკიცებულებები, ტესტირება, ექსპერიმენტები, ვალიდაცია და თვალსაჩინო პროგრესი."], ["Research and development quality", "evidence, testing, experimentation, validation and demonstrable progress."]], [["პრეზენტაცია და დაცვა", "პროექტის ახსნის, გადაწყვეტილებების დასაბუთებისა და კითხვებზე პასუხის გაცემის უნარი."], ["Presentation and defense", "the ability to explain the project, justify decisions and respond to questions."]]], "awards": [[["მთავარი პრიზი", "New Vision-ის ინოვაციების ჩემპიონი, გადაეცემა ყველა კატეგორიაში წარმოდგენილ საუკეთესო პროექტს."], ["Grand Prize", "New Vision Innovation Champion, awarded to the strongest overall project across all categories."]], [["კატეგორიების ჯილდოები", "თითო გამარჯვებული პროექტი კონკურსის ოთხივე კატეგორიაში."], ["Category Awards", "one winning project in each of the four competition categories."]], [["სპეციალური აღიარება", "ჯილდოები შეიძლება გადაეცეს სოციალური ზემოქმედების, რეგიონული ინოვაციების, სამეცნიერო კვლევებში მიღწეული ბრწყინვალე შედეგებისა და აუდიტორიის ჩართულობის სფეროებში განსაკუთრებული მიღწევებისთვის."], ["Special Recognition", "distinctions may recognize exceptional achievements in social impact, regional innovation, research excellence and audience engagement."]]], "eligibility": [["საქართველოს საჯარო ან კერძო სკოლების VII–XII კლასებში ჩარიცხული მოსწავლეები.", "Grades VII–XII students enrolled in public or private schools in Georgia."], ["ინდივიდუალური მონაწილეები ან 2–4 სტუდენტისგან შემდგარი გუნდები; თითოეულ პროექტში მაქსიმუმ ოთხი სტუდენტი.", "Individual participants or teams of 2–4 students; maximum four students per project."], ["სხვადასხვა სკოლის მოსწავლეებს შეუძლიათ ერთი გუნდის შექმნა.", "Students from different schools may form one team."], ["თითოეულ პროექტს უნდა ჰყავდეს სრულწლოვანი ხელმძღვანელი, მაგალითად, მასწავლებელი ან სხვა დამტკიცებული პასუხისმგებელი სრულწლოვანი პირი.", "Each project must have an adult supervisor, such as a teacher or another approved responsible adult."], ["მონაწილეობა უფასოა; კონკურსებში მონაწილეობის წინა გამოცდილება აუცილებელი არ არის.", "Participation is free; previous competition experience is not required."], ["ადრე წარმოდგენილი პროექტები შეიძლება მიღებულ იქნეს, თუ განმცხადებლები მიუთითებენ თავიანთ ადრინდელ ნამუშევარზე და წარმოაჩენენ მნიშვნელოვან ახალ განვითარებას.", "Previously presented projects may be accepted if applicants disclose their earlier work and demonstrate meaningful new development."], ["პროექტები უნდა ასახავდეს სტუდენტების საკუთარ ინტელექტუალურ წვლილს; ხელმძღვანელებს შეუძლიათ მათი მიმართულების მიცემა, მაგრამ პროექტი მათ ნაცვლად არ უნდა შეასრულონ.", "Projects must represent the students' own intellectual contributions; supervisors may guide but must not complete the project."], ["ხელოვნური ინტელექტის, ონლაინრესურსებისა და გარე ინსტრუმენტების გამოყენება ნებადართულია შესაბამისი გამჟღავნების შემთხვევაში; მოქმედებს აკადემიური კეთილსინდისიერების, ეთიკისა და ინტელექტუალური საკუთრების წესები.", "AI, online resources and external tools are permitted when appropriately disclosed; academic integrity, ethics and IP rules apply."]]}, {"meta": ["ნიუ ვიჟენის ინოვაციების კონკურსი — NVIC", "New Vision Innovation Challenge — NVIC"], "nav": [["მთავარი", "Home"], ["კატეგორიები", "Categories"], ["რაუნდები", "Rounds"], ["მონაწილეობა", "Eligibility"], ["ჯილდოები", "Awards"]], "eyebrow": ["პირველი გასამართი 2026–27", "First Edition 2026–27"], "title": ["ნიუ ვიჟენის ინოვაციების კონკურსი", "New Vision Innovation Challenge"], "sub": ["ეროვნული ინოვაციებისა და კვლევის კონკურსი საშუალო სკოლის მოსწავლეებისთვის — ნიუ ვიჟენ უნივერსიტეტის ორგანიზებით.", "A national innovation & research competition for school students, organized by New Vision University."], "reg": ["რეგისტრაცია იხსნება 2026 წლის 30 ნოემბერს", "Registration opens November 30, 2026"], "cta": ["გაიგე მეტი", "Learn more"], "cd": [["დღე", "Days"], ["სთ", "Hrs"], ["წთ", "Min"], ["წმ", "Sec"]], "stats": [["4", "კატეგორია", "Categories"], ["3", "რაუნდი", "Rounds"], ["VII–XII", "კლასები", "Grades"], ["0", "₾, უფასოა", "Free entry"]], "overview": [["New Vision Innovation Challenge (NVIC) არის ინოვაციებისა და კვლევის ეროვნული კონკურსი, რომელსაც ნიუ ვიჟენ უნივერსიტეტი აწყობს. კონკურსი საქართველოს მასშტაბით გამოავლენს, წაახალისებს და მხარს უჭერს ნიჭიერ მოსწავლეებს, აძლევს მათ შესაძლებლობას, ორიგინალური იდეები ღირებულ პროექტებად, კვლევით ინიციატივებად, ტექნოლოგიურ გადაწყვეტილებებად და პრაქტიკულ ინოვაციებად აქციონ.", "The New Vision Innovation Challenge (NVIC) is a national innovation and research competition organized by New Vision University. It identifies, encourages and supports talented school students across Georgia, giving them the opportunity to transform original ideas into meaningful projects, research initiatives, technological solutions and practical innovations."], ["იმ კონკურსებისგან განსხვავებით, რომლებიც მხოლოდ მეცნიერებაზე, ტექნოლოგიასა და ინჟინერიაზეა ორიენტირებული, NVIC ინოვაციას უფრო ფართო, ინტერდისციპლინური გაგებით განიხილავს. მოსწავლეებსა და სტუდენტებს მოუწოდებენ, გამოიკვლიონ ჯანდაცვის, ტექნოლოგიების, განათლების, სამართლის, ბიზნესის, მდგრადი განვითარების, კომუნიკაციებისა და თანამედროვე საზოგადოების სხვა სფეროებში არსებული გამოწვევები.", "Unlike competitions focused exclusively on science, technology and engineering, NVIC embraces a broader, interdisciplinary understanding of innovation. Students are encouraged to explore challenges in healthcare, technology, education, law, business, sustainability, communications and other areas of contemporary society."], ["კონკურსი ერთმანეთთან აკავშირებს საშუალო განათლებასა და საუნივერსიტეტო დონის აკადემიურ გამოცდილებას, მონაწილეებისთვის გამოცდილი მკვლევრების, პედაგოგების, ინდუსტრიის პროფესიონალებისა და მენტორების მხარდაჭერის ხელმისაწვდომობით. მონაწილეები გადიან შერჩევის სტრუქტურირებულ პროცესს, რომელიც სრულდება ეროვნული ფინალური გამოფენითა და დაჯილდოების ცერემონიით New Vision University-ში.", "The competition connects secondary education with university-level academic expertise by providing access to experienced researchers, educators, industry professionals and mentors. Participants progress through a structured selection process culminating in a national final exhibition and awards ceremony at New Vision University."]], "vision": ["ხედვა — შეიქმნას ეროვნულ დონეზე აღიარებული პლატფორმა, სადაც ახალგაზრდები შეძლებენ ინოვაციური იდეების განვითარებას, კვლევისა და პრობლემების გადაჭრის უნარების გაძლიერებას და უმაღლესი განათლების, სამეცნიერო კვლევისა და პროფესიული შესაძლებლობების საფუძვლიანად გაცნობას, რითაც ნიჭიერ მოსწავლეებსა და New Vision University-ს შორის მყარი კავშირი ჩამოყალიბდება.", "To establish a nationally recognized platform where young people can develop innovative ideas, strengthen their research and problem-solving abilities, and gain meaningful exposure to higher education, scientific research and professional opportunities, creating a lasting connection between talented school students and New Vision University."], "mission": ["მისიაა, შთააგონოს და შესაძლებლობები მისცეს სკოლის მოსწავლეებს, გამოავლინონ მნიშვნელოვანი გამო ": ["ორგანიზატორი", "Organized by"], "foot": ["ნიუ ვიჟენ უნივერსიტეტი · თბილისი, საქართველო", "New Vision University · Tbilisi, Georgia"], "contact": ["კონტაქტი", "Contact"]});
let lang = localStorage.getItem('nvic-page-lang') || 'ka';
const t = a => a[lang === 'ka' ? 0 : 1];
function render(){
  document.documentElement.lang = lang;
  document.getElementById('langb').textContent = lang === 'ka' ? 'English' : 'ქართული';
  document.getElementById('wmSub').textContent = 'New Vision Innovation Challenge';
  document.getElementById('nav').innerHTML = L.nav.map((p,i)=>'<a href="#'+['top','categories','rounds','eligibility','awards'][i]+'">'+t(p)+'</a>').join('');
  document.getElementById('eyebrow').textContent = t(L.eyebrow);
  document.getElementById('h1').innerHTML = lang==='ka' ? 'ნიუ ვიჟენის ინოვაციების<br><em>კონკურსი</em>' : 'New Vision Innovation<br><em>Challenge</em>';
  document.getElementById('sub').textContent = t(L.sub);
  document.getElementById('reg').innerHTML = '<b>'+t(L.reg)+'</b>';
  document.getElementById('stats').innerHTML = L.stats.map(s=>'<div class="stat"><b>'+s[0]+'</b><span>'+(lang==='ka'?s[1]:s[2])+'</span></div>').join('');
  document.getElementById('ovT').textContent = lang==='ka'?'მიმოხილვა':'Overview';
  document.getElementById('ovP').innerHTML = L.overview.map(p=>'<p style="color:var(--mut);font-size:15px;margin-bottom:12px">'+t(p)+'</p>').join('');
  document.getElementById('vmV').innerHTML = '<div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyd);font-weight:700;margin-bottom:8px">'+t(L.visionT)+'</div><p style="color:var(--mut);font-size:14.5px">'+t(L.vision)+'</p>';
  document.getElementById('vmM').innerHTML = '<div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyd);font-weight:700;margin-bottom:8px">'+t(L.missionT)+'</div><p style="color:var(--mut);font-size:14.5px">'+t(L.mission)+'</p>';
  document.getElementById('catT').textContent = t(L.catT);
  document.getElementById('cats').innerHTML = L.categories.map((c,i)=>'<div class="card cat"><div class="num">'+(i+1)+'</div><h3>'+t(c.n)+'</h3><p>'+t(c.d)+'</p><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:8px">'+t(L.fieldsT)+'</div><div class="chips">'+c.f[lang==='ka'?0:1].map(f=>'<span class="chip">'+f+'</span>').join('')+'</div></div>').join('');
  document.getElementById('inter').textContent = t(L.inter);
  document.getElementById('roundsT').textContent = t(L.roundsT);
  document.getElementById('roundsList').innerHTML = L.rounds.map((r,i)=>'<div class="it" data-n="'+(i+1)+'"><h3>'+t(r.t)+'</h3><p>'+t(r.d)+'</p></div>').join('');
  document.getElementById('eligT').textContent = t(L.eligT);
  document.getElementById('elig').innerHTML = L.eligibility.map(e=>'<li>'+t(e)+'</li>').join('');
  document.getElementById('evalT').textContent = t(L.evalT);
  document.getElementById('crit').innerHTML = L.criteria.map((c,i)=>'<div class="crit"><div class="n">'+(i+1)+'</div><div><b>'+t(c)[0]+'</b><span>'+t(c)[1]+'</span></div></div>').join('');
  document.getElementById('awardsT').textContent = t(L.awardsT);
  document.getElementById('awardsList').innerHTML = L.awards.map((a,i)=>'<div class="card'+(i===0?' gold':'')+'"><b>'+t(a)[0]+'</b><p>'+t(a)[1]+'</p></div>').join('');
  document.getElementById('datesT').textContent = t(L.datesT);
  document.getElementById('datesC').innerHTML = L.dates.map(dd=>'<div class="card"><b>'+(lang==='ka'?dd[0]:dd[1])+'</b><span>'+(lang==='ka'?dd[2]:dd[3])+'</span></div>').join('');
  document.getElementById('org').textContent = t(L.org);
  document.getElementById('foot').innerHTML = t(L.foot)+' · <a href="mailto:info@newvision.ge">'+t(L.contact)+'</a>';
}
function toggle(){ lang = lang==='ka'?'en':'ka'; localStorage.setItem('nvic-page-lang',lang); render(); }
const LAUNCH = new Date('2026-11-30T00:00:00+04:00').getTime();
function tick(){
  const s = Math.max(0, Math.floor((LAUNCH - Date.now())/1000));
  const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60];
  document.getElementById('cd').innerHTML = v.map((x,i)=>'<div><b>'+x+'</b><span>'+t(L.cd[i])+'</span></div>').join('');
}
render(); tick(); setInterval(tick, 1000);
</script>
